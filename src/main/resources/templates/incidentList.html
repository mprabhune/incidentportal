<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incident List</title>
</head>
<body>
<h1>Existing Incidents</h1>
<ul>
    <li th:each="incident : ${incidents}">
        Incident #<span th:text="${incident.incidentNumber}"></span> -
        <span th:text="${incident.remarks}"></span>
    </li>
</ul>
</body>
</html>
